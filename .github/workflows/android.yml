name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach APKs to a GitHub Release on tag builds

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore (only when secrets are configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.AURORO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AURORO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURORO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            # A malformed secret must never block CI: fall back to the debug-signed path
            # with a loud warning instead of failing the whole build.
            # Tolerant decode: strips whitespace/newlines, accepts URL-safe alphabet,
            # restores padding, then requires real JKS/PKCS#12 magic bytes so a garbage
            # secret can never fail the release build later.
            KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | tr '_-' '/+')
            case $(( ${#B64} % 4 )) in
              2) B64="$B64==" ;;
              3) B64="$B64=" ;;
            esac
            if printf '%s' "$B64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null && [ -s "$KEYSTORE_FILE" ]; then
              MAGIC=$(head -c 4 "$KEYSTORE_FILE" | od -An -tx1 | tr -d ' \n')
              case "$MAGIC" in
                feedfeed | 3082*)
                  echo "AURORO_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
                  echo "signed=true" >> "$GITHUB_OUTPUT"
                  echo "::notice title=APK signing status::Complete production signing configuration detected; the release APK will be verified before it can be published."
                  ;;
                *)
                  rm -f "$KEYSTORE_FILE"
                  echo "signed=false" >> "$GITHUB_OUTPUT"
                  echo "::warning title=APK signing status::AURORO_KEYSTORE_BASE64 decoded but is not a JKS/PKCS#12 keystore (bad magic bytes); building debug-signed only. Re-upload base64 of the raw .jks/.p12 file bytes."
                  ;;
              esac
            else
              rm -f "$KEYSTORE_FILE"
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=APK signing status::Signing secrets are present but AURORO_KEYSTORE_BASE64 did not decode to a non-empty file; building debug-signed only. Re-upload base64 of the raw .jks/.p12 FILE BYTES (not a path, password, or hex)."
            fi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No complete release signing configuration found: a debug APK is available for CI smoke testing only; no production APK will be published."
            echo "::notice title=APK signing status::Production signing is not configured for this run; no release APK will be published."
          fi

      - name: Unit tests, lint, debug + release build
        env:
          AURORO_KEYSTORE_PASSWORD: ${{ secrets.AURORO_KEYSTORE_PASSWORD }}
          AURORO_KEY_ALIAS: ${{ secrets.AURORO_KEY_ALIAS }}
          AURORO_KEY_PASSWORD: ${{ secrets.AURORO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue testDebugUnitTest lintDebug assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Verify generated APK signatures
        if: success()
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          else
            echo "No production-signed release APK is available to verify."
          fi

      - name: Publish APK verification status in check summary
        if: success()
        run: |
          {
            echo "## APK verification"
            echo "- Debug APK: cryptographic signature verified with apksigner."
            if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
              echo "- Release APK: production signing configuration supplied; signature verified with apksigner."
            else
              echo "- Release APK: no verified production-signed artifact was generated; no release APK is attached."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface build/test failures as check annotations
        if: failure()
        run: python3 .github/scripts/annotate_failures.py build.log

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "dist/auroro-wallpapers-${VERSION}-debug.apk"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/auroro-wallpapers-${VERSION}-release.apk"
          fi
          for apk in dist/*.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -la dist

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: auroro-wallpapers-apk
          path: dist/*
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

      - name: Refuse to overwrite an existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.substring(context.ref.lastIndexOf("/") + 1);
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setFailed(`Release ${tag} already exists; refusing to replace or modify it.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v') && success()
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^" ]+' app/build.gradle.kts)
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "Release tag $TAG_NAME does not match app version v$VERSION" >&2
            exit 1
          fi
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            printf '%s\n' "> **⚠️ Debug-signed build — not a production release artifact.** Production signing secrets (\`AURORO_KEYSTORE_*\`) are not configured, so the attached APK is the CI **debug** build: debug-key signed, no minification. Install it for evaluation only (\`adb install -r\`). Once signing secrets exist, the next version's tag run will attach a verified production-signed release APK." > "$RUNNER_TEMP/release-notes-debug.md"
          fi

      - name: Attach verified production APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success() && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Auroro Wallpapers ${{ github.ref_name }}
          files: |
            dist/*-release.apk
            dist/*-release.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Attach labeled debug APK to GitHub Release while production signing is unavailable
        if: startsWith(github.ref, 'refs/tags/v') && success() && steps.signing.outputs.signed != 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Auroro Wallpapers ${{ github.ref_name }} (debug build)
          files: |
            dist/*-debug.apk
            dist/*-debug.apk.sha256
          body_path: ${{ runner.temp }}/release-notes-debug.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: false
