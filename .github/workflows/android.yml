name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach APKs to a GitHub Release on tag builds

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore (only when secrets are configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.AURORO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AURORO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured: the release APK will NOT be signed."
          fi

      - name: Unit tests, lint, debug + release build
        env:
          AURORO_KEYSTORE_PASSWORD: ${{ secrets.AURORO_KEYSTORE_PASSWORD }}
          AURORO_KEY_ALIAS: ${{ secrets.AURORO_KEY_ALIAS }}
          AURORO_KEY_PASSWORD: ${{ secrets.AURORO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue testDebugUnitTest lintDebug assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Surface build/test failures as check annotations
        if: failure()
        run: python3 .github/scripts/annotate_failures.py build.log

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "dist/auroro-wallpapers-${VERSION}-debug.apk"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/auroro-wallpapers-${VERSION}-release.apk"
          fi
          ls -la dist

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: auroro-wallpapers-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

      - name: Attach APKs to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
